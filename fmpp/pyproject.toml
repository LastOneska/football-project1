[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-match-probability-predictor"
version = "1.0.0"
description = "Local football match probability analysis CLI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv==1.1.0",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "requests==2.32.3",
    "psycopg[binary]==3.2.6",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.4",
    "pytz==2024.2",
]

[project.scripts]
fmpp = "src.cli:app"
fmpp-web = "src.api.app:run"

[tool.vercel]
entrypoint = "src.api.app:app"

[tool.setuptools.packages.find]
include = ["src*"]
